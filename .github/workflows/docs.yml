# The documentation's checks: the API reference is current, every guide has its Japanese page, every link and picture is there, and every example in
# the README, the docs and the guides runs against the built package. Free on a public repository.
name: Docs
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'src/**', 'scripts/docs.mjs', 'scripts/docs-site.mjs', 'scripts/check-readme-examples.ts', 'CHANGELOG.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'src/**', 'scripts/docs.mjs', 'scripts/docs-site.mjs', 'scripts/check-readme-examples.ts', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:api:check
      - run: pnpm docs:check
      - run: pnpm test:readme
